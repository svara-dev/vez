# vez's main config file, installed at /etc/vez/vez.conf. See `man dnf.conf`
# for background: vez understands a subset of the same [main] options, in the
# same format.
#
# Every option below is commented out at its vez default. Uncomment and edit
# to override.
#
# `$releasever` is NOT this file's VERSION_ID. Vez reads it from the base
# image's Fedora release (/etc/fedora-release), falling back to VERSION_ID only
# when that file is absent, because Fedora's mirrors are organised by Fedora
# releases and Svara's own VERSION_ID is Svara's version. An explicit
# /etc/dnf/vars/releasever still outranks both.

[main]
#cachedir=/var/cache/vez
#reposdir=/etc/yum.repos.d
#keepcache=0
#assumeyes=0
#gpgcheck=1
#best=1
#exclude=
#includepkgs=
#metadata_expire=172800
#retries=10
#timeout=30
#max_parallel_downloads=3
#skip_if_unavailable=0
#clean_requirements_on_remove=1
#installroot=/
