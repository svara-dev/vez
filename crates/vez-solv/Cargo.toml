[package]
name = "vez-solv"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vez-core = { workspace = true }
anyhow = { workspace = true }

[build-dependencies]
bindgen = { version = "0.70", features = ["experimental"], optional = true }
pkg-config = "0.3"
cc = "1"

[features]
# Regenerate crates/vez-solv/generated/{bindings.rs,static_fns.c} from the
# system's libsolv headers with bindgen instead of using the committed copies.
# Off by default so ordinary builds (RPM builds included) don't need
# libclang/clang-devel. On EL10, clang-devel pulls in a newer llvm-libs than
# the distro's `rust` package is built against, which makes the two
# BuildRequires impossible to install together. After upgrading libsolv, run
# `cargo build -p vez-solv --features regen-bindings` to refresh the vendored
# files.
regen-bindings = ["dep:bindgen"]
